# Синтетический Registration Service (учебный пример, НЕ реальная инфраструктура AITU)
apiVersion: v1
kind: Namespace
metadata:
  name: aitu-sim
---
# --- Имитация базы данных: просто TCP-порт 5432 (масштабируем в 0 для эксперимента 3) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-mock
  namespace: aitu-sim
spec:
  replicas: 1
  selector:
    matchLabels: { app: db-mock }
  template:
    metadata:
      labels: { app: db-mock }
    spec:
      containers:
        - name: db-mock
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5432", "-text=db-ok"]
          ports:
            - containerPort: 5432
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: db-mock
  namespace: aitu-sim
spec:
  selector: { app: db-mock }
  ports:
    - port: 5432
      targetPort: 5432
---
# --- Код синтетического приложения (ConfigMap, чтобы не собирать свой образ) ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registration-app
  namespace: aitu-sim
data:
  app.py: |
    import os, socket
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    DB = (os.getenv("DB_HOST", "db-mock"), int(os.getenv("DB_PORT", "5432")))
    POD = os.getenv("HOSTNAME", "unknown")

    def db_ok():
        try:
            socket.create_connection(DB, timeout=1).close()
            return True
        except OSError:
            return False

    class H(BaseHTTPRequestHandler):
        def _send(self, code, body):
            b = body.encode()
            self.send_response(code)
            self.send_header("Content-Type", "text/plain; charset=utf-8")
            self.send_header("Content-Length", str(len(b)))
            self.end_headers()
            self.wfile.write(b)

        def do_GET(self):
            if self.path == "/healthz":      # liveness: процесс жив
                self._send(200, "alive")
            elif self.path == "/ready":      # readiness: приложение готово принимать трафик
                self._send(200, "ready")
            elif self.path == "/register":   # бизнес-запрос: нужна БД
                if db_ok():
                    self._send(200, "registered by " + POD)
                else:
                    self._send(503, "database unavailable")
            else:
                self._send(404, "not found")

        def log_message(self, *a):
            pass

    ThreadingHTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
# --- Registration Service: 2 реплики + пробы + ресурсы + rolling update ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
  namespace: aitu-sim
  labels: { app: registration-service }
spec:
  replicas: 2                      # две реплики (требование задания)
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate            # плавное обновление
    rollingUpdate:
      maxUnavailable: 0            # во время обновления всегда остаются обе рабочие реплики
      maxSurge: 1                  # временно поднимаем 3-й под
  selector:
    matchLabels: { app: registration-service }
  template:
    metadata:
      labels: { app: registration-service }
    spec:
      restartPolicy: Always        # автоматический перезапуск контейнера
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:   # по возможности разнести реплики по разным узлам
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: registration-service }
      containers:
        - name: registration
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          env:
            - { name: DB_HOST, value: db-mock }
            - { name: DB_PORT, value: "5432" }
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: app, mountPath: /app }
          readinessProbe:          # когда под можно включать в балансировку
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:           # когда контейнер нужно перезапустить
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
      volumes:
        - name: app
          configMap: { name: registration-app }
---
# --- Service discovery: стабильное DNS-имя registration-service.aitu-sim.svc ---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
  namespace: aitu-sim
spec:
  type: ClusterIP
  selector: { app: registration-service }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# --- Не даём добровольным операциям (drain узла) убрать обе реплики сразу ---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: registration-pdb
  namespace: aitu-sim
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: registration-service }
