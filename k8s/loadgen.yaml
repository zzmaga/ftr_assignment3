# Генератор нагрузки: ~10 запросов/с к registration-service, пишет "epoch код" в лог
apiVersion: v1
kind: ConfigMap
metadata:
  name: loadgen-app
  namespace: aitu-sim
data:
  loadgen.py: |
    import time, urllib.request, urllib.error
    URL = "http://registration-service/register"
    while True:
        t = time.time()
        try:
            code = urllib.request.urlopen(URL, timeout=1).status
        except urllib.error.HTTPError as e:
            code = e.code
        except Exception:
            code = 0
        print(f"{t:.3f} {code}", flush=True)
        time.sleep(0.1)
---
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  namespace: aitu-sim
spec:
  containers:
    - name: loadgen
      image: python:3.12-alpine
      command: ["python", "-u", "/app/loadgen.py"]
      volumeMounts:
        - { name: app, mountPath: /app }
  volumes:
    - name: app
      configMap: { name: loadgen-app }
